name: Scheduled Upstream Sync

on:
  schedule:
    # This runs the sync automatically every day at midnight UTC.
    # You can change this cron schedule if you want it more frequent.
    - cron: '0 0 * * *'
  workflow_dispatch: # This lets you trigger the sync manually from GitHub anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and Sync Upstream FMHY Repo
        run: |
          git remote add upstream https://github.com/fmhy/edit.git || true
          git fetch upstream main
          # Force merge incoming updates, automatically accepting upstream layout content
          git merge upstream/main -X theirs --allow-unrelated-histories -m "Automated Sync with Upstream FMHY Wiki"

      - name: Push Updated Data to Your GitHub Branch
        run: |
          git push origin main
